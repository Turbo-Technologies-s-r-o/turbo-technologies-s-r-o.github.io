<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TurboNexus PDM: parts register and change control | Turbo Technologies</title>
<meta name="description" content="Interactive demonstration of the TurboNexus parts register: product structure, revisions and a change notice on a real access platform design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBFCFD;--ink:#17212B;--steel:#55636F;--mist:#8A97A3;--rule:#D5DCE3;--petrol:#0C6577;--petrol-soft:#E3F0F2;--wash:#F2F5F8;
  --released:#2F9475;--review:#C98A00;--draft:#7C8A97;--new:#2B7BB9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
.app{display:grid;height:100%;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:52px 46px minmax(0,1fr) 30px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--rule);background:#fff}
.mark{font:600 19px/1 "IBM Plex Sans Condensed",sans-serif;white-space:nowrap;text-decoration:none;color:inherit}.mark span{color:var(--petrol)}
.crumb{color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumb b{color:var(--ink);font-weight:500}
.by{color:var(--steel);text-decoration:none;white-space:nowrap;border-left:1px solid var(--rule);padding-left:14px}.by:hover{color:var(--petrol)}
.sp{flex:1}
.tabs{grid-column:1/-1;display:flex;align-items:center;gap:4px;padding:0 14px;border-bottom:1px solid var(--rule);background:#fff}
.tabs button{border:0;background:none;padding:12px 12px 10px;cursor:pointer;border-bottom:2px solid transparent;color:var(--steel);white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--petrol);font-weight:500}
.tabs .cnt{color:var(--mist);margin-left:5px;font-variant-numeric:tabular-nums}
.tabs input{margin-left:auto;width:260px;max-width:40vw;padding:6px 9px;border:1px solid var(--rule);border-radius:7px;background:var(--paper)}
.main{overflow:auto;min-width:0}
.side{border-left:1px solid var(--rule);background:#fff;overflow:auto}
.foot{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 18px;border-top:1px solid var(--rule);background:#fff;color:var(--steel);font-size:12.5px;white-space:nowrap;overflow:hidden}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:#fff;text-align:left;font-weight:500;color:var(--steel);padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:8px 12px;border-bottom:1px solid #E7ECF0;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--wash)}tbody tr.sel{background:var(--petrol-soft)}
.pn{font-weight:500;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.st i{width:8px;height:8px;border-radius:50%;display:inline-block}
.Released i{background:var(--released)}.In-review i{background:var(--review)}.Draft i{background:var(--draft)}
.chip{display:inline-block;border:1px solid var(--rule);border-radius:20px;padding:1px 9px;font-size:12.5px;color:var(--steel);white-space:nowrap}
.chip.cn{border-color:var(--review);color:#8A5F00;background:#FFF7E3}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px 4px}
.filters button{border:1px solid var(--rule);background:#fff;border-radius:20px;padding:4px 12px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pad{padding:18px 20px}
h1{font:600 22px/1.15 "IBM Plex Sans Condensed",sans-serif;margin:0 0 2px}
h2{font:600 15px/1.2 "IBM Plex Sans Condensed",sans-serif;margin:20px 0 8px}
.sub{color:var(--steel)}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:14px 0 0}dt{color:var(--steel)}dd{margin:0}
.rev{display:grid;grid-template-columns:34px 1fr;gap:2px 10px;padding:9px 0;border-top:1px solid var(--rule)}
.rev b{font:600 17px/1.2 "IBM Plex Sans Condensed",sans-serif}
.rev .m{color:var(--steel);font-size:12.5px}
.lnk{border:0;background:none;padding:0;color:var(--petrol);cursor:pointer;text-align:left}
.lnk:hover{text-decoration:underline}
.row2{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid #E7ECF0}
.row2:first-of-type{border-top:0}
.empty{color:var(--steel);padding:26px 20px}
/* structure */
.tree{padding:10px 8px 20px}
.node{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer}
.node:hover{background:var(--wash)}.node.sel{background:var(--petrol-soft)}
.tw{width:16px;flex:none;color:var(--mist);text-align:center}
.node .q{color:var(--mist);font-variant-numeric:tabular-nums;white-space:nowrap}
.node .nm{color:var(--steel);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.kids{margin-left:22px;border-left:1px solid var(--rule)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:5px 12px;cursor:pointer;border-left:1px solid var(--rule)}.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
/* change notice */
.cnwrap{padding:20px 24px 30px;max-width:980px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:16px 0 6px;counter-reset:s}
.fs{position:relative;padding:34px 14px 0 0}
.fs:before{counter-increment:s;content:counter(s);position:absolute;top:0;left:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;background:#fff;border:1.5px solid var(--rule);color:var(--steel);z-index:1}
.fs:after{content:"";position:absolute;top:12px;left:24px;right:0;height:1.5px;background:var(--rule)}
.fs:last-child:after{display:none}
.fs.done:before{background:var(--released);border-color:var(--released);color:#fff;content:"✓"}
.fs.done:after{background:var(--released)}
.fs.now:before{background:var(--review);border-color:var(--review);color:#fff}
.fs b{display:block}.fs span{color:var(--steel);font-size:12.5px;display:block}
.fs p{margin:4px 0 0;font-size:13px;color:var(--steel);max-width:210px}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.pics img{width:100%;height:auto;display:block;border:1px solid var(--rule);border-radius:8px}
.pics figure{margin:0}.pics figcaption{color:var(--steel);font-size:12.5px;margin-top:4px}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--rule)}.checks li:first-child{border-top:0}
.warn{flex:none;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:#fff;background:var(--review);margin-top:1px}
.sumt td{padding:6px 12px 6px 0;border-bottom:1px solid #E7ECF0}.sumt td:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}
.sumt td:last-child{font-weight:600}
@media (max-width:900px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto;min-height:100vh}
  .top{flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px}.crumb,.top .sp{display:none}
  .tabs{flex-wrap:wrap;padding:0 8px}.tabs input{width:100%;max-width:none;margin:6px 4px 10px}
  .main{overflow:visible}.side{border:0;border-top:1px solid var(--rule);overflow:visible}
  .foot{white-space:normal;flex-wrap:wrap;padding:8px 12px;gap:4px 12px;height:auto}
  .hide-s{display:none}.flow{grid-template-columns:1fr 1fr;row-gap:16px}.pics{grid-template-columns:1fr}
  td,th{padding:8px 8px}.pn{white-space:normal;word-break:break-word}
  .hide-m{display:none}
  .side{position:fixed;left:0;right:0;bottom:0;max-height:62vh;overflow:auto;border-top:1px solid var(--rule);box-shadow:0 -8px 24px rgba(23,33,43,.14);border-radius:14px 14px 0 0;z-index:5}
  .side.none{display:none}
  .close{display:block}
  .cnwrap{padding:16px 14px 30px}
}
.close{display:none;position:sticky;top:0;float:right;margin:10px 10px 0 0;border:1px solid var(--rule);background:#fff;border-radius:20px;padding:4px 12px;cursor:pointer}
</style>
</head>

</div>

function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));q.style.visibility=t==='reg'?'visible':'hidden';render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
q.oninput=()=>render();
function render(){main.innerHTML='';({reg:register,str:structure,chg:change})[tab]();card()}
// ---------- register
function register(){
  const f=el('div','filters');['All','Assembly','Part','Standard','Purchased','In change'].forEach(t=>{const b=el('button',null,t);b.setAttribute('aria-pressed',t===typeF);b.onclick=()=>{typeF=t;render()};f.appendChild(b)});main.appendChild(f);
  const s=q.value.trim().toLowerCase();
  let rows=D.items.filter(i=>(typeF==='All'||(typeF==='In change'?i.cn:i.type===typeF))&&(!s||(i.pn+' '+i.name+' '+i.mat+' '+i.note).toLowerCase().includes(s)));
  rows.sort((a,b)=>{const x=a[sortK],y=b[sortK];return (typeof x==='number'?x-y:String(x).localeCompare(String(y),undefined,{numeric:true}))*sortD});
  const t=el('table');const cols=[['pn','Part number'],['name','Name'],['type','Type','hide-s'],['mat','Material','hide-s'],['rev','Rev.','hide-m'],['status','Status'],['qty0','Qty','num hide-m']];
  t.innerHTML='<thead><tr>'+cols.map(c=>`<th class="${c[2]||''}" data-k="${c[0]}">${c[1]}${sortK===c[0]?(sortD>0?' ↑':' ↓'):''}</th>`).join('')+'</tr></thead>';
  const tb=el('tbody');
  rows.forEach(i=>{const r=el('tr',sel===i.pn?'sel':'');r.innerHTML=`<td class="pn">${esc(i.pn)}</td><td>${esc(i.name)}${i.note?` <span class="sub">${esc(i.note)}</span>`:''}${i.cn?' <span class="chip cn">'+D.cn.id+'</span>':''}</td><td class="hide-s">${i.type}</td><td class="hide-s">${esc(i.mat)}</td><td class="hide-m">${i.rev}${i.pending?' → '+i.pending:''}</td><td>${st(i.status)}</td><td class="num hide-m">${i.qty0||'new'}</td>`;r.onclick=()=>{sel=i.pn;render()};tb.appendChild(r)});
  t.appendChild(tb);main.appendChild(t);
  if(!rows.length)main.appendChild(el('div','empty','No part matches. Try a part number, a name or a standard, for example “DIN 934”.'));
  t.querySelectorAll('th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;if(sortK===k)sortD=-sortD;else{sortK=k;sortD=1}render()});
}
// ---------- structure
const open=new Set([D.root]);
function structure(){
  const bar=el('div','filters');bar.innerHTML='<span class="sub" style="align-self:center;margin-right:6px">Show the structure</span>';
  const sg=el('div','seg');[['as released (rev A)',0],['after '+D.cn.id+' (in review)',1]].forEach(([t,v])=>{const b=el('button',null,t);b.setAttribute('aria-pressed',variant===v);b.onclick=()=>{variant=v;render()};sg.appendChild(b)});bar.appendChild(sg);main.appendChild(bar);
  const K=variant?D.kids1:D.kids0, K0=D.kids0;
  const tr=el('div','tree');
  (function walk(pn,qty,parent,path,box){
    const kids=K[pn],key=path+'/'+pn,n=el('div','node'+(sel===pn?' sel':''));
    const changed=variant&&parent&&((K0[parent]||{})[pn]!==qty);
    n.innerHTML=`<span class="tw">${kids?(open.has(key)||open.has(pn)&&!path?'▾':'▸'):''}</span><span class="pn">${esc(pn)}</span><span class="nm">${esc(I[pn].name)}${I[pn].note?', '+esc(I[pn].note):''}</span>${changed?'<span class="chip cn">'+(((K0[parent]||{})[pn])?((K0[parent][pn])+' → '+qty):'new')+'</span>':''}<span class="q">× ${qty}</span>`;
    const isOpen=kids&&(open.has(key)||(!path&&open.has(pn)));
    n.onclick=()=>{sel=pn;if(kids){const k=path?key:pn;open.has(k)?open.delete(k):open.add(k)}render()};box.appendChild(n);
    if(isOpen){const kb=el('div','kids');Object.keys(kids).sort((a,b)=>(K[b]?1:0)-(K[a]?1:0)||a.localeCompare(b,undefined,{numeric:true})).forEach(c=>walk(c,kids[c],pn,key,kb));box.appendChild(kb)}
  })(D.root,1,null,'',tr);
  main.appendChild(tr);
}
// ---------- change notice
function change(){
  const c=D.cn,w=el('div','cnwrap');
  w.innerHTML=`<div class="sub">${c.id} · opened ${c.date}</div><h1>${esc(c.title)}</h1><div style="margin-top:6px">${st(c.status)}</div>
  <p style="max-width:640px;margin:14px 0 0">Request in words: ${esc(c.request)} The design agent made the change on a copy of the model and prepared this notice. Nothing is released until an engineer closes the checks.</p>
  <h2>Release route</h2><div class="flow">${c.flow.map(f=>`<div class="fs ${f.state}"><b>${f.step}</b><span>${f.who}${f.date?', '+f.date:''}</span><p>${esc(f.text)}</p></div>`).join('')}</div>
  <h2>Open checks for the design engineer</h2><ul class="checks">${c.checks.map(x=>`<li><span class="warn">!</span><span>${esc(x)}</span></li>`).join('')}</ul>
  <h2>What changes in the product</h2><table class="sumt" style="max-width:520px"><tr><td class="sub"></td><td class="sub">Before</td><td class="sub">After</td></tr>${c.summary.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>
  <div class="pics"><figure><img src="nexus-pdm-before.jpg" alt="Access platform with 8 steps" loading="lazy"><figcaption>Released model, 8 steps</figcaption></figure><figure><img src="nexus-pdm-after.jpg" alt="Access platform with 10 steps, changed parts in red" loading="lazy"><figcaption>Proposed model, 10 steps. Changed parts in red.</figcaption></figure></div>
  <h2>Affected items</h2>`;
  const t=el('table');t.innerHTML='<thead><tr><th>Part number</th><th>Name</th><th>Change</th></tr></thead>';const tb=el('tbody');
  c.affected.forEach(a=>{const r=el('tr',sel===a.pn?'sel':'');r.innerHTML=`<td class="pn">${esc(a.pn)}</td><td>${esc(a.name)}</td><td>${esc(a.change)}</td>`;r.onclick=()=>{sel=a.pn;render()};tb.appendChild(r)});t.appendChild(tb);w.appendChild(t);
  main.appendChild(w);
}
// ---------- item card
function card(){
  side.innerHTML='';side.classList.toggle('none',!sel);
  if(sel){const x=el('button','close','Close');x.onclick=()=>{sel=null;render()};side.appendChild(x)}
  if(!sel){side.appendChild(el('div','empty',tab==='chg'?'Select an affected item to see its revisions and where it is used.':'Select a part to see its revisions, where it is used and what the open change does to it.'));return}
  const i=I[sel],p=el('div','pad');
  p.innerHTML=`<div class="sub">${i.type}</div><h1>${esc(i.pn)}</h1><div>${esc(i.name)}</div><div style="margin-top:8px">${st(i.status)} <span class="sub">revision ${i.rev}${i.pending?', revision '+i.pending+' in review':''}</span></div>
  <dl>${i.mat?`<dt>Material</dt><dd>${esc(i.mat)}</dd>`:''}${i.note?`<dt>Note</dt><dd>${esc(i.note)}</dd>`:''}<dt>In the product</dt><dd>${i.qty0?i.qty0+' pcs':'not yet'}${i.qty1!==i.qty0?` → ${i.qty1?i.qty1+' pcs':'none'} after ${D.cn.id}`:''}</dd>${i.type!=='Standard'&&i.type!=='Purchased'?'<dt>Model</dt><dd>STEP, kept inside the customer perimeter</dd>':''}</dl>`;
  if(i.cn){const b=el('div');b.style.marginTop='14px';b.innerHTML=`<span class="chip cn">${D.cn.id}</span> `;const l=el('button','lnk','Open the change notice');l.onclick=()=>setTab('chg');b.appendChild(l);
    if(i.supersededBy){const s=el('div');s.style.marginTop='6px';s.append('To be replaced by ');const k=el('button','lnk',esc(i.supersededBy));k.onclick=()=>{sel=i.supersededBy;render()};s.appendChild(k);b.appendChild(s)}
    if(i.base){const s=el('div');s.style.marginTop='6px';s.append('Replaces ');const k=el('button','lnk',esc(i.base));k.onclick=()=>{sel=i.base;render()};s.appendChild(k);b.appendChild(s)}
    p.appendChild(b)}
  p.appendChild(el('h2',null,'Revisions'));
  i.revs.forEach(r=>p.appendChild(el('div','rev',`<b>${r.rev}</b><div>${st(r.status)}<div class="m">${r.date} · ${r.by}</div><div>${esc(r.text)}</div></div>`)));
  const u=i.used1.length?i.used1:i.used0;
  p.appendChild(el('h2',null,'Where it is used'));
  if(!u.length)p.appendChild(el('div','sub',i.pn===D.root?'This is the top assembly.':'Not used in any assembly.'));
  u.forEach(x=>{const r=el('div','row2');const k=el('button','lnk',esc(x.pn)+' <span class="sub">'+esc(I[x.pn].name)+'</span>');k.onclick=()=>{sel=x.pn;render()};const old=(i.used0.find(y=>y.pn===x.pn)||{}).qty;r.appendChild(k);r.appendChild(el('span','sub',(old&&old!==x.qty?old+' → ':'')+'× '+x.qty));p.appendChild(r)});
  side.appendChild(p);
}
render();
window.PDM={setTab,select:pn=>{sel=pn;render()}};
</script>
</body>
</html>
