<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TurboNexus: secondary air network on a section | Turbo Technologies</title>
<meta name="description" content="Interactive demonstration: a 150-element secondary air network laid on a section cut from STEP geometry. Synthetic data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFCFD; --stage-a:#EEF2F6; --stage-b:#DCE3EA; --ink:#17212B; --steel:#55636F; --mist:#8A97A3;
  --rule:#D5DCE3; --petrol:#0C6577; --petrol-soft:#E3F0F2; --select:#F2A900;
  --orifice:#2B7BB9; --seal:#C8445A; --channel:#2F9475;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
.app{display:grid;height:100%;grid-template-columns:248px minmax(0,1fr) 332px;grid-template-rows:52px minmax(0,1fr) 30px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--rule);background:#fff}
.mark{font:600 19px/1 "IBM Plex Sans Condensed",sans-serif;letter-spacing:.01em;white-space:nowrap}
.mark span{color:var(--petrol)}
.crumb{color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:500}
.by{color:var(--steel);text-decoration:none;white-space:nowrap;border-left:1px solid var(--rule);padding-left:14px}
.by:hover{color:var(--petrol)}
.top .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;border-left:1px solid var(--rule);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.left{border-right:1px solid var(--rule);background:#fff;overflow:auto;padding:14px 16px 18px}
.right{border-left:1px solid var(--rule);background:#fff;overflow:auto}
h2{font:600 15px/1.2 "IBM Plex Sans Condensed",sans-serif;margin:0 0 8px;letter-spacing:.01em}
.block{margin-bottom:20px}
.chk{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
.chk input{accent-color:var(--petrol);margin:0}
.chk .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk .c{color:var(--mist);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.seg.col{display:grid;grid-template-columns:1fr 1fr;width:100%}
.seg.col button{border-left:0;border-top:1px solid var(--rule);padding:6px 4px}
.seg.col button:nth-child(-n+2){border-top:0}
.seg.col button:nth-child(even){border-left:1px solid var(--rule)}
#q{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:7px;background:var(--paper)}
#hits{margin-top:6px;max-height:190px;overflow:auto}
.hit span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:4px 6px;border-radius:5px;cursor:pointer}
.hit:hover{background:var(--petrol-soft)}
.hit i{font-style:normal;color:var(--mist);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage{position:relative;background:linear-gradient(180deg,var(--stage-a),var(--stage-b));min-width:0;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.legend{position:absolute;left:16px;bottom:14px;background:rgba(255,255,255,.92);border:1px solid var(--rule);border-radius:8px;padding:9px 12px;min-width:210px}
.legend .t{font-weight:500;margin-bottom:6px}
.ramp{height:8px;border-radius:4px}
.rl{display:flex;justify-content:space-between;color:var(--steel);font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums}
.keys{display:flex;gap:12px;font-size:13px}.keys span{display:flex;align-items:center;gap:5px}.keys i{width:16px;height:4px;border-radius:2px;display:inline-block}
.marks{margin-top:7px;padding-top:7px;border-top:1px solid var(--rule);color:var(--steel);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
.marks span{display:flex;align-items:center;gap:5px}
.hintbar{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 18px;border-top:1px solid var(--rule);background:#fff;color:var(--steel);font-size:12.5px;white-space:nowrap;overflow:hidden}
.hintbar .sp{flex:1}
.pad{padding:16px 18px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule)}
.sum div{padding:13px 0 12px 18px;border-left:1px solid var(--rule)}
.sum div:first-child{border-left:0}
.sum b{display:block;font:600 24px/1 "IBM Plex Sans Condensed",sans-serif;font-variant-numeric:tabular-nums}
.sum span{color:var(--steel);font-size:12.5px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:5px 6px;margin:0 -6px;border-radius:6px;cursor:pointer}
.bar:hover{background:var(--petrol-soft)}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--steel)}
.bar .tr{grid-column:1/-1;height:5px;border-radius:3px;background:#EDF1F4;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:3px;background:var(--petrol)}
.bar.src .tr i{background:#7C8A97}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:9px;padding:5px 0;border-top:1px solid var(--rule)}
.checks li:first-child{border-top:0}
.ok,.warn{flex:none;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:#fff;margin-top:1px}
.ok{background:var(--channel)}.warn{background:#C98A00}
.back{border:0;background:none;color:var(--petrol);padding:0;cursor:pointer;margin-bottom:10px}
.title{font:600 21px/1.15 "IBM Plex Sans Condensed",sans-serif;margin:0 0 4px}
.kind{color:var(--steel);margin-bottom:14px}
.kind i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.big{font:600 34px/1 "IBM Plex Sans Condensed",sans-serif;font-variant-numeric:tabular-nums}
.big small{font:400 14px "IBM Plex Sans",sans-serif;color:var(--steel);margin-left:6px}
.drop{margin:16px 0 6px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.drop .end{font-variant-numeric:tabular-nums}
.drop .end b{display:block;font:600 19px/1.1 "IBM Plex Sans Condensed",sans-serif}
.drop .end span{color:var(--steel);font-size:12.5px;display:block;line-height:1.3}
.drop .end:last-child{text-align:right}
.drop .ar{color:var(--mist);padding-bottom:4px}
.dbar{height:8px;border-radius:4px;margin-bottom:14px}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0}
dt{color:var(--steel)}dd{margin:0;font-variant-numeric:tabular-nums}
.conn{margin-top:16px}
.note{color:var(--steel);font-size:12.5px;border-top:1px solid var(--rule);padding:12px 18px}
#msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--steel)}
@media (max-width:1050px){.app{grid-template-columns:210px minmax(0,1fr) 280px}}
@media (max-width:820px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto;min-height:100vh}
  .top{order:0;flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px}
  .top .sp{display:none}.crumb{display:none}
  #views{max-width:100%;overflow-x:auto}#views button{padding:7px 10px}
  .stage{order:1;height:60vh;min-height:330px;flex:none}
  .right{order:2;border:0;border-top:1px solid var(--rule);overflow:visible}
  .left{order:3;border:0;border-top:1px solid var(--rule);overflow:visible}
  .hintbar{order:4;white-space:normal;flex-wrap:wrap;padding:8px 12px;gap:4px 12px;height:auto}
  .legend{left:8px;bottom:8px;min-width:0;padding:6px 9px}.legend .marks{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a class="mark" href="./#turbonexus" style="text-decoration:none;color:inherit">Turbo<span>Nexus</span></a>
    <div class="crumb">Secondary air <b id="mname"></b></div>
    <a class="by" href="./">by Turbo Technologies</a>
    <div class="sp"></div>
    <div class="seg" id="views" role="group" aria-label="View">
      <button data-v="full">Full model</button><button data-v="cut" aria-pressed="true">Cut by Nexus</button><button data-v="sec">Face on</button><button data-v="tur">Turbine</button><button data-v="bl">Blade matrix</button>
    </div>
  </div>
  <aside class="left">
    <div class="block"><h2>Find an element</h2><input id="q" type="search" placeholder="seal, pre-swirl, pipe A" autocomplete="off"><div id="hits"></div></div>
    <div class="block"><h2>Colour the network by</h2>
      <div class="seg col" id="modes" role="group"><button data-m="p" aria-pressed="true">Pressure</button><button data-m="t">Temperature</button><button data-m="f">Flow share</button><button data-m="k">Element type</button></div></div>
    <div class="block"><h2>Section</h2>
      <label class="chk"><input type="checkbox" id="sOn" checked><span class="n">Cut the model with a plane</span></label>
      <div style="display:flex;gap:8px;align-items:center;margin:6px 0"><div class="seg" id="sAx" role="group" aria-label="Plane normal"><button data-a="0">X</button><button data-a="1" aria-pressed="true">Y</button><button data-a="2">Z</button></div>
      <label class="chk" style="margin-left:4px"><input type="checkbox" id="sFlip" checked><span class="n">Flip</span></label></div>
      <input type="range" id="sPos" min="0" max="1000" value="500" style="width:100%;accent-color:var(--petrol)" aria-label="Plane position"><div id="sVal" style="color:var(--steel);font-size:12.5px"></div></div>
    <div class="block"><h2>Network</h2><div id="lNet"></div></div>
    <div class="block"><h2>Geometry</h2><div id="lGeo"></div><label class="chk" style="margin-top:6px"><input type="checkbox" id="edges" checked><span class="n">Edges</span></label></div>
  </aside>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div id="msg">Loading the model</div>
    <div class="legend" id="legend"></div>
  </div>
  <aside class="right" id="insp"></aside>
  <div class="hintbar"><span>Drag to rotate, right-drag or Shift to pan, scroll to zoom, click a line or a node</span><span class="sp"></span><span id="prov"></span></div>
</div>
<script src="nexus-sas-demo-data.js"></script>
<script>
"use strict";
(function(){
const META=window.TN_META, NET=META.network, msg=document.getElementById('msg');
const cv=document.getElementById('cv'), gl=cv.getContext('webgl2',{antialias:true,stencil:true});
if(!gl){msg.textContent='This browser has no WebGL2, so the 3D view cannot open.';return}
const bs=atob(window.TN_MESH), u8=new Uint8Array(bs.length); for(let i=0;i<bs.length;i++)u8[i]=bs.charCodeAt(i); const bin=u8.buffer; window.TN_MESH=null;
document.getElementById('mname').textContent='/ '+META.title;
document.getElementById('prov').textContent=`Geometry read from ${META.step.file} by the TurboNexus STEP reader: ${META.step.solids} solids, ${META.step.faces} faces, ${META.step.failed} failed. Network and values are synthetic. © 2026 Turbo Technologies s.r.o.`;
// ---- math
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],scl=(a,s)=>[a[0]*s,a[1]*s,a[2]*s],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],nrm=a=>{const l=Math.hypot(...a)||1;return a.map(x=>x/l)};
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s}return o}
function persp(fy,as,n,f){const t=1/Math.tan(fy/2),o=new Float32Array(16);o[0]=t/as;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o}
function look(e,c){const z=nrm(sub(e,c)),x=nrm(cross([0,0,1],z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1])}
// ---- GL
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
const P=gl.createProgram();
gl.attachShader(P,sh(gl.VERTEX_SHADER,`#version 300 es
layout(location=0) in vec3 aPos;layout(location=1) in vec3 aNrm;uniform mat4 uVP;out vec3 vW,vN;
void main(){vW=aPos;vN=aNrm;gl_Position=uVP*vec4(aPos,1.0);}`));
gl.attachShader(P,sh(gl.FRAGMENT_SHADER,`#version 300 es
precision highp float;in vec3 vW,vN;uniform vec3 uC,uEye;uniform int uMode;uniform float uId,uFlat;uniform vec4 uClip;out vec4 o;
void main(){
 if(dot(vec4(vW,1.0),uClip)>0.0)discard;
 if(uMode==3){float h=step(0.82,fract((vW.x+vW.y+vW.z)*0.11));o=vec4(uC*(0.80-0.10*h),1.0);return;}
 if(uMode==1){float id=uId+1.0;o=vec4(mod(id,256.0),mod(floor(id/256.0),256.0),floor(id/65536.0),255.0)/255.0;return;}
 if(uMode==2){o=vec4(uC,0.42);return;}
 vec3 n=normalize(vN),v=normalize(uEye-vW);if(dot(n,v)<0.0)n=-n;
 vec3 L1=normalize(vec3(.35,-.75,.6)),L2=normalize(vec3(-.6,.3,.4));
 float d=.50+.42*max(dot(n,L1),0.)+.16*max(dot(n,L2),0.)+.06*max(n.z,0.);
 d=mix(d,0.92+0.08*max(dot(n,v),0.),uFlat);
 o=vec4(uC*d+(1.0-uFlat)*pow(max(dot(reflect(-L1,n),v),0.),28.)*.10,1.);}`));
gl.linkProgram(P);gl.useProgram(P);
const U=n=>gl.getUniformLocation(P,n),uVP=U('uVP'),uC=U('uC'),uEye=U('uEye'),uMode=U('uMode'),uId=U('uId'),uFlat=U('uFlat'),uClip=U('uClip');
const B=(t,d)=>{const b=gl.createBuffer();gl.bindBuffer(t,b);gl.bufferData(t,d,gl.STATIC_DRAW);return b};
const QM=65535, items=[]; // one drawable per instance (all identity in this model)
let bbMin=[1e9,1e9,1e9],bbMax=[-1e9,-1e9,-1e9];
const byKey={};
META.inst.forEach(([k,m,path],id)=>{
  const p=META.parts[k], q=new Uint16Array(bin,p.v[0],p.v[1]*3), pos=new Float32Array(q.length);
  for(let i=0;i<q.length;i++){const a=i%3;pos[i]=p.lo[a]+q[i]*p.sc[a]}
  const idx=p.i[2]===2?new Uint16Array(bin,p.i[0],p.i[1]):new Uint32Array(bin,p.i[0],p.i[1]);
  const n=new Float32Array(pos.length);
  for(let t=0;t<idx.length;t+=3){const a=idx[t]*3,b=idx[t+1]*3,c=idx[t+2]*3;const ux=pos[b]-pos[a],uy=pos[b+1]-pos[a+1],uz=pos[b+2]-pos[a+2],wx=pos[c]-pos[a],wy=pos[c+1]-pos[a+1],wz=pos[c+2]-pos[a+2];
    const nx=uy*wz-uz*wy,ny=uz*wx-ux*wz,nz=ux*wy-uy*wx;for(const j of[a,b,c]){n[j]+=nx;n[j+1]+=ny;n[j+2]+=nz}}
  const vao=gl.createVertexArray();gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER,B(gl.ARRAY_BUFFER,pos));gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,B(gl.ARRAY_BUFFER,n));gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0);
  B(gl.ELEMENT_ARRAY_BUFFER,idx.slice());
  const it={id,k,group:path[1],pos,idx,name:p.name,vao,n:idx.length,type:p.i[2]===2?gl.UNSIGNED_SHORT:gl.UNSIGNED_INT,col:p.color||[.8,.8,.8],net:k[0]==='e'||k[0]==='n',vis:true,
    c:[p.lo[0]+p.sc[0]*QM/2,p.lo[1]+p.sc[1]*QM/2,p.lo[2]+p.sc[2]*QM/2]};
  if(p.e[1]){const qe=new Uint16Array(bin,p.e[0],p.e[1]*3),e=new Float32Array(qe.length);for(let i=0;i<qe.length;i++){const a=i%3;e[i]=p.lo[a]+qe[i]*p.sc[a]}
    it.ev=gl.createVertexArray();gl.bindVertexArray(it.ev);gl.bindBuffer(gl.ARRAY_BUFFER,B(gl.ARRAY_BUFFER,e));gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);gl.vertexAttrib3f(1,0,0,1);it.ne=p.e[1]}
  if(k[0]==='g'&&path[1]===undefined)it.group='Geometry';
  if(!it.net)for(let a=0;a<3;a++){bbMin[a]=Math.min(bbMin[a],p.lo[a]);bbMax[a]=Math.max(bbMax[a],p.lo[a]+p.sc[a]*QM)}
  items.push(it); byKey[k]=it;
});
gl.bindVertexArray(null);
const center=scl(add(bbMin,bbMax),.5), R=Math.hypot(...sub(bbMax,bbMin))/2;
// ---- network data and colours
const E=NET.elements, Nd=NET.nodes, nodeBy={}; Nd.forEach(n=>nodeBy[n.id]=n);
const lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t), ramp=(st,t)=>{t=Math.max(0,Math.min(1,t));const k=t*(st.length-1),i=Math.min(st.length-2,Math.floor(k));return lerp(st[i],st[i+1],k-i)};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255), css=c=>'rgb('+c.map(x=>Math.round(x*255)).join(',')+')';
const RP=['#7FD0DC','#3D9BD1','#3A5FC0','#7C3FA8','#C2337A','#D8432E'].map(hex), RT=['#3F7FC4','#69B5C9','#E9D08A','#E59A4A','#C9541E'].map(hex), RF=['#C9D3DB','#8FB6C2','#3F8FA3','#0C6577','#093A47'].map(hex);
const KC={orifice:hex('#2B7BB9'),seal:hex('#C8445A'),channel:hex('#2F9475')};
const pAll=Nd.map(n=>n.p), pMin=Math.min(...pAll), pMax=Math.max(...pAll), tAll=E.map(e=>e.T), tMin=Math.min(...tAll), tMax=Math.max(...tAll), fAll=E.map(e=>e.share), fMin=Math.min(...fAll), fMax=Math.max(...fAll);
const cP=p=>ramp(RP,Math.log(p/pMin)/Math.log(pMax/pMin)), cT=T=>ramp(RT,(T-tMin)/(tMax-tMin)), cF=f=>ramp(RF,Math.log(f/fMin)/Math.log(fMax/fMin));
let mode='p', sel=null, typeOn={orifice:true,seal:true,channel:true};
const SEL=hex('#F2A900');
function paint(){
  E.forEach(e=>{const it=byKey[e.k]; it.col=mode==='p'?cP(e.pu):mode==='t'?cT(e.T):mode==='f'?cF(e.share):KC[e.type]; it.vis=layer.elements&&typeOn[e.type]});
  Nd.forEach(n=>{const it=byKey[n.k]; it.col=n.b?[.99,.99,.99]:(mode==='t'?cT(Math.min(tMax,Math.max(tMin,n.T))):cP(n.p)); it.vis=n.b?layer.boundaries:layer.cavities});
  if(sel)byKey[sel.k].col=SEL;
  legend(); draw();
}
function legend(){
  const L=document.getElementById('legend'); const g=st=>'linear-gradient(90deg,'+st.map(css).join(',')+')';
  const marks='<div class="marks"><span><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="#3A5FC0"/></svg>cavity</span><span><svg width="12" height="12"><rect x="2" y="2" width="8" height="8" fill="#fff" stroke="#55636F" stroke-width="1.4"/></svg>boundary</span><span>thickness = mass flow</span></div>';
  if(mode==='k')L.innerHTML='<div class="t">Element type</div><div class="keys"><span><i style="background:var(--orifice)"></i>orifice</span><span><i style="background:var(--seal)"></i>seal</span><span><i style="background:var(--channel)"></i>channel</span></div>'+marks;
  else{const [t,st,a,b]=mode==='p'?['Upstream pressure, kPa',RP,Math.round(pMin),Math.round(pMax)]:mode==='t'?['Air temperature, K',RT,Math.round(tMin),Math.round(tMax)]:['Share of secondary air, %',RF,fMin.toFixed(2),fMax.toFixed(0)];

let pend=false;function draw(){if(!pend){pend=true;requestAnimationFrame(()=>{pend=false;render(0)})}}

let fbo=null,fw=0,fh=0;
